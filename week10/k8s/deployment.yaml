apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
spec:
  replicas: 5
  selector:
    matchLabels:
      app: guestbook
  template:
    metadata:
      labels:
        app: guestbook
    spec:
      containers:
        - name: guestbook
          image: guestbook:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
